name: Deploy UpdateUser to AWS EC2

on:
  push:
    branches:
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v3

    - name: 🐳 Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 📦 Build Docker image
      run: |
        docker build -t mateocarr/projectawsstore-updateuser:latest .
    
    - name: 🚀 Push Docker image to Docker Hub
      run: |
        docker push mateocarr/projectawsstore-updateuser:latest

    - name: 🔑 Connect to EC2 and deploy container
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_UPDATE }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Iniciar sesión en Docker Hub
          sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

          # Descargar la última imagen desde Docker Hub
          sudo docker pull mateocarr/projectawsstore-updateuser:latest

          # Detener y eliminar el contenedor anterior si existe
          sudo docker stop updateuser || true && sudo docker rm updateuser || true

          # Crear el archivo .env desde el secreto de GitHub
          echo "${{ secrets.ENV_FILE }}" > .env

          # Ejecutar el contenedor con el archivo .env
          sudo docker run -d -p 5007:5007 -p 4007:4007 --env-file .env --name updateuser mateocarr/projectawsstore-updateuser
